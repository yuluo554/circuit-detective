name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: "verify (${{ matrix.os }}, node ${{ matrix.node }})"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ["22", "24"]
    steps:
      - name: "Checkout"
        uses: actions/checkout@v4

      - name: "Setup Node"
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: "Show versions"
        run: node --version

      - name: "Sprint layout gate (methodology binding)"
        run: node tools/check-sprint-layout.mjs

      - name: "Fixtures reproduce byte-for-byte"
        run: node tools/gen-fixtures.mjs --check

      - name: "Unit and cross-implementation tests"
        run: npm test

      - name: "Full self-check"
        run: npm run verify

      - name: "Build single-file bundle"
        run: npm run build

      - name: "Scan build output for external links"
        run: node tools/check-dist.mjs
